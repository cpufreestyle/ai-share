name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.3.1）'
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零依赖项目：无需 npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

      # 校验 tag 与 package.json 版本号一致，避免发错版本
      # workflow_dispatch 手动触发时用输入的 tag
      - name: Verify version matches tag
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${RAW#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 ($PKG) 不一致"
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            target: node20-win-x64
            artifact: ai-share-windows-x64.exe
          - os: ubuntu-latest
            label: linux-x64
            target: node20-linux-x64
            artifact: ai-share-linux-x64
          - os: macos-13          # Intel runner
            label: macos-x64
            target: node20-macos-x64
            artifact: ai-share-macos-x64
          - os: macos-latest      # Apple Silicon runner
            label: macos-arm64
            target: node20-macos-arm64
            artifact: ai-share-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pkg
        run: npm install --no-save --no-audit --no-fund @yao-pkg/pkg@^6.6.0

      - name: Build binary
        shell: bash
        run: |
          npx pkg server.js \
            --targets ${{ matrix.target }} \
            --output "dist/${{ matrix.artifact }}"

      # pkg 产物不带执行位，Unix 上需手动补
      - name: Make executable (unix)
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.artifact }}"

      # 冒烟测试：启动服务并确认首页可访问，避免发布坏包
      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        # set -e 会让循环里首次 curl 失败即中断，故显式关闭
        shell: bash --noprofile --norc {0}
        env:
          AI_SHARE_NO_OPEN: '1'
        run: |
          set +e
          "./dist/${{ matrix.artifact }}" > smoke.log 2>&1 &
          PID=$!

          ok=0
          for i in $(seq 1 30); do
            # 同时探测 IPv4 与 IPv6 回环，避免解析差异导致误判
            if curl -fsS --max-time 3 http://127.0.0.1:4737/ >/dev/null 2>&1 \
               || curl -fsS --max-time 3 http://[::1]:4737/ >/dev/null 2>&1; then
              ok=1
              break
            fi
            # 进程已退出则无需继续等待
            if ! kill -0 $PID 2>/dev/null; then
              echo "进程提前退出" >&2
              break
            fi
            sleep 1
          done

          echo "--- server output ---"
          cat smoke.log || true

          kill $PID 2>/dev/null
          if [ "$ok" != "1" ]; then
            echo "FAIL: server did not respond in 30s" >&2
            exit 1
          fi
          echo "OK: server responded"

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AI_SHARE_NO_OPEN: '1'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $p = Start-Process -FilePath "dist/${{ matrix.artifact }}" `
              -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err `
              -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            if ($p.HasExited) { Write-Output '进程提前退出'; break }
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:4737/' -TimeoutSec 3 -UseBasicParsing | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          Write-Output '--- server output ---'
          if (Test-Path smoke.log) { Get-Content smoke.log }
          if (Test-Path smoke.err) { Get-Content smoke.err }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error 'FAIL: server did not respond in 30s'; exit 1 }
          Write-Output 'OK: server responded'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # 从 CHANGELOG 中提取当前版本的段落作为发布说明
      - name: Extract release notes
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "未在 CHANGELOG.md 中找到 $VERSION 的条目" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
