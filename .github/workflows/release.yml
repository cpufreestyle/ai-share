name: Release

# 推送 v* 形式的 tag 时触发，例如 v0.2.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 零依赖项目：无需 npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

      # 校验 tag 与 package.json 版本号一致，避免发错版本
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 ($PKG) 不一致"
            exit 1
          fi

      # 从 CHANGELOG 中提取当前版本的段落作为发布说明
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "未在 CHANGELOG.md 中找到 $VERSION 的条目" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
