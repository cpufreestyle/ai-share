name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.3.1）'
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零依赖项目：无需 npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

      # 校验 tag 与 package.json 版本号一致，避免发错版本
      # workflow_dispatch 手动触发时用输入的 tag
      - name: Verify version matches tag
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${RAW#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 ($PKG) 不一致"
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            target: node22-win-x64
            artifact: ai-share-windows-x64.exe
          - os: ubuntu-latest
            label: linux-x64
            target: node22-linux-x64
            artifact: ai-share-linux-x64
          - os: macos-13          # Intel runner
            label: macos-x64
            target: node22-macos-x64
            artifact: ai-share-macos-x64
          - os: macos-latest      # Apple Silicon runner
            label: macos-arm64
            target: node22-macos-arm64
            artifact: ai-share-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node & pkg versions
        run: |
          node -v
          npm -v
          npx --yes @yao-pkg/pkg@6.22.0 --version

      - name: Install pkg
        run: npm install --no-save --no-audit --no-fund @yao-pkg/pkg@6.22.0

      - name: Build binary
        shell: bash
        run: |
          npx pkg server.js \
            --targets ${{ matrix.target }} \
            --output "dist/${{ matrix.artifact }}"

      # pkg 产物不带执行位，Unix 上需手动补
      - name: Make executable (unix)
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.artifact }}"

      # 冒烟测试：启动服务并确认首页可访问，避免发布坏包
      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        # set -e 会让循环里首次 curl 失败即中断，故显式关闭
        shell: bash --noprofile --norc {0}
        env:
          AI_SHARE_NO_OPEN: '1'
          # 显式固定端口：runner 环境可能已存在 PORT 变量，
          # 而 server.js 用的是 process.env.PORT || 4737
          PORT: '4737'
        run: |
          set +e
          echo "PORT=$PORT"
          "./dist/${{ matrix.artifact }}" > smoke.log 2>&1 &
          PID=$!

          ok=0
          # pkg 打的 exe 在 CI runner 上首次解包 + Node 启动可能耗时较久，
          # pkg 打的 exe 首次解包 + Node 启动在 CI runner 上实测可达 121s，
          # 等待窗口放宽到 300s，并预留充足余量（避免差 1 秒而误判）
          for i in $(seq 1 300); do
            # server.js 已显式绑定 0.0.0.0，IPv4 回环必然可达；
            # 同时保留 IPv6 探测以兼容纯 IPv6 环境
            if curl -fsS --max-time 2 http://127.0.0.1:4737/ >/dev/null 2>&1 \
               || curl -fsS --max-time 2 http://[::1]:4737/ >/dev/null 2>&1; then
              ok=1
              break
            fi
            # 进程已退出则无需继续等待
            if ! kill -0 $PID 2>/dev/null; then
              echo "进程提前退出" >&2
              break
            fi
            sleep 1
          done

          echo "--- server output ---"
          cat smoke.log || true
          echo "--- listening sockets ---"
          (command -v ss >/dev/null && ss -lntp 2>/dev/null | grep -E '4737|LISTEN' ) || true

          if [ "$ok" != "1" ]; then
            # 诊断须在 kill 之前做，否则 server 已退出会误报 Connection refused
            echo "--- curl -v diagnosis ---"
            curl -v --max-time 5 http://127.0.0.1:4737/ 2>&1 || true
            kill $PID 2>/dev/null
            echo "FAIL: server 在 300s 内未响应" >&2
            exit 1
          fi
          kill $PID 2>/dev/null
          echo "OK: server responded"

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AI_SHARE_NO_OPEN: '1'
          PORT: '4737'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Output "PORT=$env:PORT"
          $p = Start-Process -FilePath "dist/${{ matrix.artifact }}" `
              -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err `
              -PassThru -WindowStyle Hidden
          $ok = $false
          # pkg 打的 exe 首次解包 + Node 启动在 CI runner 上实测可达 121s，
          # 等待窗口放宽到 300s，并预留充足余量
          for ($i = 0; $i -lt 300; $i++) {
            if ($p.HasExited) { Write-Output '进程提前退出'; break }
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:4737/' -TimeoutSec 2 -UseBasicParsing | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          Write-Output '--- server output ---'
          if (Test-Path smoke.log) { Get-Content smoke.log }
          if (Test-Path smoke.err) { Get-Content smoke.err }
          Write-Output '--- listening ports ---'
          try { Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -eq 4737 } | Format-Table -AutoSize | Out-String | Write-Output } catch { Write-Output 'Get-NetTCPConnection 不可用' }
          if (-not $ok) {
            # 诊断须在停止进程之前做，否则 server 已退出会误报 Connection refused
            try { Invoke-WebRequest -Uri 'http://127.0.0.1:4737/' -TimeoutSec 5 -UseBasicParsing | Out-Null } catch { Write-Output 'curl -v 诊断: 连接被拒绝（server 未监听）' }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error 'FAIL: server 在 300s 内未响应'; exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Output 'OK: server responded'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}-smoke
          path: |
            smoke.log
            smoke.err
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # 从 CHANGELOG 中提取当前版本的段落作为发布说明
      - name: Extract release notes
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "未在 CHANGELOG.md 中找到 $VERSION 的条目" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
