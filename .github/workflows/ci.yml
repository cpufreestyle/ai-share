name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      # 混合平台：本项目大量逻辑与平台相关（WSL /mnt/c 大小写、
      # process.platform 分支、{APPDATA} 占位符展开、Windows 启动脚本），
      # 只在 Linux 跑会漏掉这些回归。
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 零依赖项目：无需 npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
