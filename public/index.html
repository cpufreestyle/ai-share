<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Share · 共享 AI 资源管理</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">AI<span>Share</span></div>
      <div class="sub">共享 AI 资源中心</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn primary" id="collectBtn" style="width:100%;margin-bottom:10px">🔍 一键采集本机资源</button>
      <div id="status" class="status">● 本地服务已连接</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">资源</h1>
      <div class="actions" id="topActions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modalTitle"></span><button id="modalClose">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-foot"><button id="modalSave" class="btn primary">保存</button></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
